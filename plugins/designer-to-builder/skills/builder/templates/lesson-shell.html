<!-- Builder lesson shell. Don't edit per lesson: scripts/build-lesson.sh fills {{TITLE}}, {{MINUTES}} and the content. -->
<title>{{TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a calm course player. Sticky progress header, step outline on the left, one step at a time in a readable column. */
:root {
  --bg: #f3f4f6; --panel: #ffffff; --ink: #1d2126; --muted: #6f7680; --line: #e3e6ea; --soft: #f5f6f8;
  --green: #17936b; --green-soft: #e1f4ec; --orange: #d9602f; --orange-soft: #fcece4; --blue: #2f6bd9; --blue-soft: #e7effc;
  --code-bg: #f6f7f9; --btn: #1d2126; --btn-ink: #ffffff;
  --f-body: "Lexend", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121417; --panel: #1a1d22; --ink: #eef0f3; --muted: #9aa1ab; --line: #2b3038; --soft: #22262c;
  --green: #3ccb97; --green-soft: #163128; --orange: #ff8a5c; --orange-soft: #3a2219; --blue: #7ea6ff; --blue-soft: #1c2740;
  --code-bg: #16191e; --btn: #eef0f3; --btn-ink: #121417; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121417; --panel: #1a1d22; --ink: #eef0f3; --muted: #9aa1ab; --line: #2b3038; --soft: #22262c;
  --green: #3ccb97; --green-soft: #163128; --orange: #ff8a5c; --orange-soft: #3a2219; --blue: #7ea6ff; --blue-soft: #1c2740;
  --code-bg: #16191e; --btn: #eef0f3; --btn-ink: #121417; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 300 17px/1.6 var(--f-body); }
h1, h2, h3, p, ol, ul, dl, dd { margin: 0; }
h1 { font-weight: 500; font-size: 1rem; line-height: 1.3; }
h2 { font-weight: 500; font-size: clamp(1.45rem, 3.5vw, 1.9rem); line-height: 1.25; text-wrap: balance; }
h3 { font-weight: 500; font-size: 1rem; }
strong, b { font-weight: 500; }
code { font-family: var(--f-mono); font-size: .84em; background: var(--soft); padding: 1px 6px; border-radius: 6px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
.muted { color: var(--muted); }

/* Header with progress */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 16px; }
.brand { font-weight: 500; white-space: nowrap; } .brand span { color: var(--green); }
.bar h1 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-weight: 400; }
.where { font-size: .85rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.track { height: 4px; background: var(--soft); }
.track i { display: block; height: 100%; width: 0; background: var(--green); transition: width .3s ease; }

/* Shell: outline + content */
.shell { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 40px; align-items: start; }
.outline { position: sticky; top: 84px; display: grid; gap: 14px; }
.outline ol { list-style: none; padding: 0; display: grid; gap: 2px; }
.outline ol button { width: 100%; text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: 10px; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; color: var(--muted); }
.outline ol button:hover { background: var(--panel); }
.outline .n { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: .8rem; background: var(--panel); }
.outline ol [aria-current="step"] { background: var(--panel); color: var(--ink); font-weight: 400; }
.outline ol [aria-current="step"] .n { border-color: var(--green); color: var(--green); }
.outline ol .done .n { background: var(--green); border-color: var(--green); color: var(--panel); }
.viewall { background: none; border: 0; color: var(--blue); font-size: .85rem; text-align: left; padding: 0 10px; text-decoration: underline; text-underline-offset: 3px; }

/* Steps */
main { min-width: 0; max-width: 720px; }
.step { display: grid; gap: 22px; }
.step + .step { margin-top: 56px; }
.js .paged .step + .step { margin-top: 0; }
.eyebrow { font-size: .85rem; color: var(--green); font-weight: 400; }
.lead { font-size: 1.1rem; color: var(--muted); }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; display: grid; gap: 10px; min-width: 0; }
.box h3 { display: flex; align-items: center; gap: 8px; }

/* Goal */
.goal { border-left: 4px solid var(--green); }
.goal p { font-size: 1.15rem; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.meta span { font-size: .85rem; padding: 4px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }

/* Choice buttons (guess + quiz) */
.choices { display: grid; gap: 8px; }
.choice { text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.choice:hover { border-color: var(--muted); }
.choice .k { width: 28px; height: 28px; border-radius: 8px; background: var(--soft); display: grid; place-items: center; font-size: .85rem; }
.choice[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); }
.choice.right { border-color: var(--green); background: var(--green-soft); }
.choice.wrong { border-color: var(--orange); background: var(--orange-soft); }
.feedback { border-radius: 12px; padding: 12px 14px; font-size: .95rem; }
.feedback.ok { background: var(--green-soft); } .feedback.no { background: var(--orange-soft); }
.feedback:empty { display: none; }

/* Key words */
.terms { display: grid; gap: 12px; }
.term { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: grid; gap: 4px; }
.term dt { font-weight: 500; font-size: 1.05rem; }
.term .like { color: var(--muted); font-size: .92rem; }

/* How it works: vertical flow with labels in the diagram */
.flow { list-style: none; padding: 0; display: grid; gap: 0; }
.flow li { display: grid; grid-template-columns: 36px 1fr; gap: 14px; position: relative; padding-bottom: 18px; }
.flow li:not(:last-child)::before { content: ""; position: absolute; left: 17px; top: 36px; bottom: 0; width: 2px; background: var(--line); }
.flow .dot { width: 36px; height: 36px; border-radius: 50%; background: var(--panel); border: 2px solid var(--line); display: grid; place-items: center; font-size: .9rem; position: relative; }
.flow .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
.flow .card small { color: var(--muted); font-size: .85rem; }
.flow .new .dot { border-color: var(--green); color: var(--green); }
.flow .new .card { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.badge { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: var(--green-soft); color: var(--green); margin-left: 6px; vertical-align: 2px; }

/* What we changed: code with numbered callouts */
.tabs { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: none; padding: 6px 16px; border-radius: 999px; font-size: .9rem; color: var(--muted); }
.tabs [aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
.pane-label { font-size: .85rem; color: var(--muted); }
.code { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 0; overflow-x: auto; font: 400 .85rem/1.75 var(--f-mono); white-space: normal; }
.code span { display: block; padding-inline: 14px; white-space: pre; }
.code .a { background: var(--green-soft); } .code .d { background: var(--orange-soft); }
.code .c { color: var(--muted); }
.code .m { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--green); color: var(--panel); font-size: .7rem; margin-left: 8px; padding: 0; vertical-align: 1px; white-space: normal; }
.callouts { list-style: none; padding: 0; display: grid; gap: 10px; }
.callouts li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; }
.callouts .m { width: 24px; height: 24px; border-radius: 50%; background: var(--green); color: var(--panel); display: grid; place-items: center; font-size: .75rem; margin-top: 2px; }
.files { list-style: none; padding: 0; display: grid; gap: 8px; }
.files li { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.files .num { font-variant-numeric: tabular-nums; font-size: .9rem; } .p { color: var(--green); } .mi { color: var(--orange); }

/* Self-explanation */
textarea { width: 100%; min-height: 90px; resize: vertical; font: inherit; font-size: .95rem; color: var(--ink); background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; }

/* Wrap up */
.can { list-style: none; padding: 0; display: grid; gap: 8px; }
.can li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; }
.tick { width: 22px; height: 22px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: grid; place-items: center; font-size: .8rem; margin-top: 3px; }
.ship { list-style: none; padding: 0; display: grid; }
.ship li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ship li:last-child { border-bottom: 0; }
.ship small { color: var(--muted); font-size: .85rem; grid-column: 1; }
.st { font-size: .8rem; padding: 3px 10px; border-radius: 999px; align-self: start; grid-row: span 2; }
.st.ok { background: var(--green-soft); color: var(--green); } .st.todo { background: var(--orange-soft); color: var(--orange); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: .85rem; padding: 4px 12px; border-radius: 999px; background: var(--soft); }
.chips .up { background: var(--green-soft); color: var(--green); }
.next-q { background: var(--ink); color: var(--panel); border: 0; }
.next-q p { font-size: 1.1rem; }
.next-q .eyebrow { color: inherit; opacity: .7; }
.cmds { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .9rem; color: var(--muted); }
.cmds code { background: var(--panel); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; }

/* Overview */
.num-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--panel); display: inline-grid; place-items: center; font-size: .78rem; flex: none; }
.verdict { font-size: 1.05rem; }
.score { list-style: none; padding: 0; display: grid; }
.score li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.score small { color: var(--muted); font-size: .85rem; grid-column: 1; }
.lvl { font-size: .8rem; padding: 3px 10px; border-radius: 999px; align-self: start; grid-row: span 2; white-space: nowrap; }
.lvl.good { background: var(--green-soft); color: var(--green); }
.lvl.ok { background: var(--soft); color: var(--muted); }
.lvl.work { background: var(--orange-soft); color: var(--orange); }
.tree { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 0; overflow-x: auto; font: 400 .85rem/1.8 var(--f-mono); white-space: normal; }
.tree span { display: block; padding-inline: 14px; white-space: pre; }
.tree em { font-style: normal; color: var(--muted); font-family: var(--f-body); font-size: .85rem; }
.fit { list-style: none; padding: 0; display: grid; gap: 8px; }
.fit li { padding-left: 26px; position: relative; }
.fit li::before { position: absolute; left: 0; top: 1px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: .7rem; }
.fit .yes::before { content: "✓"; background: var(--green-soft); color: var(--green); }
.fit .meh::before { content: "!"; background: var(--orange-soft); color: var(--orange); }
.flow.compact li { padding-bottom: 10px; }
.lesson-pick { border: 2px solid var(--green); }
.pick { font-size: 1.15rem; }

/* Pager */
.pager { display: none; }
.js .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); }
.pager button { border-radius: 999px; padding: 12px 22px; border: 1.5px solid var(--line); background: var(--panel); }
.pager .go { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); margin-left: auto; }
.pager button[hidden] { display: none; }
.keys { display: none; }
@media (hover: hover) { .js .keys { display: block; font-size: .8rem; color: var(--muted); padding: 0 10px; } }

/* Narrow screens: outline becomes a step row, pager sticks to the bottom */
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-block: 16px 24px; }
  .outline { position: static; }
  .outline ol { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .outline li { flex: none; }
  .outline ol button { grid-template-columns: 26px auto; padding: 6px 10px 6px 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; font-size: .85rem; }
  .outline ol button .t { display: none; }
  .outline ol [aria-current="step"] .t { display: inline; }
  .js .pager { position: sticky; bottom: 0; background: var(--bg); margin-inline: -16px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .bar h1 { display: none; }
  .bar-in { justify-content: space-between; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="bar">
  <div class="bar-in">
    <span class="brand">Builder<span>.lesson</span></span>
    <h1>{{TITLE}}</h1>
    <span class="where" id="where">7 steps · about {{MINUTES}} min</span>
  </div>
  <div class="track" aria-hidden="true"><i id="track"></i></div>
</header>

<div class="shell">
  <nav class="outline" aria-label="Lesson steps">
    <ol id="outline"></ol>
    <button class="viewall" id="viewall" type="button" hidden>Show all steps on one page</button>
    <span class="keys">Tip: use ← → keys to move between steps</span>
  </nav>

  <main id="lesson" data-minutes="{{MINUTES}}">

    <!-- LESSON CONTENT -->

    <div class="pager">
      <button type="button" id="prev">← Back</button>
      <button type="button" id="next" class="go">Next</button>
    </div>
  </main>
</div>

<script>
(() => {
  const root = document.documentElement, main = document.getElementById('lesson');
  const steps = [...main.querySelectorAll('.step')];
  if (!steps.length) return;
  root.classList.add('js');
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  const key = 'builder:' + document.title;
  const outline = document.getElementById('outline'), where = document.getElementById('where');
  const track = document.getElementById('track'), prev = document.getElementById('prev'), next = document.getElementById('next');
  const viewall = document.getElementById('viewall');
  let cur = 0, paged = store.get('builder:view') !== 'all', seen = new Set([0]);

  steps.forEach((s, i) => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="t"></span>';
    b.querySelector('.t').textContent = s.dataset.title;
    b.addEventListener('click', () => go(i, true));
    li.appendChild(b); outline.appendChild(li);
  });
  const btns = [...outline.querySelectorAll('button')];

  function render(focus) {
    main.classList.toggle('paged', paged);
    steps.forEach((s, i) => { s.hidden = paged && i !== cur; });
    btns.forEach((b, i) => {
      b.toggleAttribute('aria-current', false);
      if (i === cur) b.setAttribute('aria-current', 'step');
      b.classList.toggle('done', seen.has(i) && i < cur);
    });
    const pct = steps.length > 1 ? cur / (steps.length - 1) * 100 : 100;
    track.style.width = (paged ? pct : 100) + '%';
    where.textContent = paged ? 'Step ' + (cur + 1) + ' of ' + steps.length : steps.length + ' steps · about ' + (main.dataset.minutes || 5) + ' min';
    prev.hidden = !paged || cur === 0;
    next.hidden = !paged;
    next.textContent = cur === steps.length - 1 ? 'Finish ✓' : 'Next: ' + steps[cur + 1].dataset.title + ' →';
    viewall.hidden = false;
    viewall.textContent = paged ? 'Show all steps on one page' : 'Go back to step by step';
    if (focus) { const h = steps[cur].querySelector('h2'); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } window.scrollTo({ top: paged ? 0 : steps[cur].offsetTop - 90 }); }
  }
  function go(i, focus) {
    if (i < 0 || i >= steps.length) return;
    cur = i; seen.add(i); store.set(key, String(i));
    try { history.replaceState(null, '', '#' + steps[i].id); } catch (e) {}
    render(focus);
  }
  prev.addEventListener('click', () => go(cur - 1, true));
  next.addEventListener('click', () => { if (cur === steps.length - 1) { next.textContent = 'Done for today ✓'; return; } go(cur + 1, true); });
  viewall.addEventListener('click', () => { paged = !paged; store.set('builder:view', paged ? 'step' : 'all'); render(true); });
  document.addEventListener('keydown', e => {
    if (!paged || e.altKey || e.metaKey || e.ctrlKey || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    if (e.key === 'ArrowRight') go(cur + 1, true);
    if (e.key === 'ArrowLeft') go(cur - 1, true);
  });

  // Guess (step 1): remember the choice, show it later. No right/wrong shown here.
  document.querySelectorAll('[data-guess]').forEach(g => {
    const id = g.dataset.guess, opts = [...g.querySelectorAll('.choice')];
    opts.forEach(o => o.addEventListener('click', () => {
      opts.forEach(x => x.setAttribute('aria-pressed', String(x === o)));
      document.querySelectorAll('[data-show-guess="' + id + '"]').forEach(t => {
        t.textContent = 'You guessed ' + o.querySelector('.k').textContent + ': ' + o.textContent.slice(1).trim();
      });
    }));
  });
  // Quiz: explanatory feedback for every option.
  document.querySelectorAll('[data-quiz]').forEach(q => {
    const fb = q.parentElement.querySelector('.feedback'), opts = [...q.querySelectorAll('.choice')];
    opts.forEach(o => o.addEventListener('click', () => {
      opts.forEach(x => x.classList.remove('right', 'wrong'));
      const ok = o.hasAttribute('data-correct');
      o.classList.add(ok ? 'right' : 'wrong');
      fb.className = 'feedback ' + (ok ? 'ok' : 'no');
      fb.textContent = o.dataset.feedback + (ok ? '' : ' Try another one.');
    }));
  });
  // Before / after tabs.
  document.querySelectorAll('[role="tablist"]').forEach(tl => {
    const tabs = [...tl.querySelectorAll('[role="tab"]')];
    tabs.forEach(t => t.addEventListener('click', () => tabs.forEach(x => {
      const on = x === t; x.setAttribute('aria-selected', String(on));
      const p = document.getElementById(x.getAttribute('aria-controls')); if (p) p.hidden = !on;
    })));
  });
  // Own-words note: kept only in this browser.
  const ta = document.getElementById('explain');
  if (ta) { ta.value = store.get(key + ':explain') || ''; ta.addEventListener('input', () => store.set(key + ':explain', ta.value)); }

  const fromHash = steps.findIndex(s => '#' + s.id === location.hash);
  const saved = parseInt(store.get(key) || '0', 10);
  cur = fromHash >= 0 ? fromHash : (saved >= 0 && saved < steps.length ? saved : 0);
  for (let i = 0; i <= cur; i++) seen.add(i);
  render(false);
})();
</script>
